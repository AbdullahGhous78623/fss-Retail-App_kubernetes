
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userprofile-deployment
  namespace: abdullah
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userprofile
  template:
    metadata:
      labels:
        app: userprofile
    spec:
      containers:
        - name: retail-app
          image: niamat12/fss-retail-app:v1
          ports:
            - containerPort: 3130
          envFrom:
            - configMapRef:
                name: abdullah-configmap
            - secretRef:
                name: abdullah-secret

version: '3.8'

services:
  app:
    image: niamat12/fss-retail-app:v1
    container_name: retail-app
    ports:
      - "3130:3130"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - retail-network

  mongo:
    image: mongo:7.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    networks:
      - retail-network

networks:
  retail-network:
    driver: bridge
